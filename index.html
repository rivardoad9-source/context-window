<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#091B42">
<title>CONTEXT WINDOW</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; background: #050D24; overflow: hidden;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0; display: grid; place-items: center;
  }
  #game {
    display: block;
    height: 100%; width: auto; max-width: 100%;
    aspect-ratio: 9 / 16;
    background: #091B42;
    touch-action: none;
    cursor: none;
    box-shadow: 0 0 0 1px rgba(120, 190, 255, 0.12), 0 30px 120px rgba(0, 0, 0, 0.75);
  }
  #hint {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    color: rgba(234, 241, 255, 0.34); font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; pointer-events: none; white-space: nowrap;
    transition: opacity 0.8s ease;
  }
  #hint.gone { opacity: 0; }
  noscript { color: #EAF1FF; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="1080" height="1920" aria-label="CONTEXT WINDOW: a tiny game where you are the AI agent collecting context tokens and dodging hallucinations"></canvas>
</div>
<div id="hint">arrows / wasd / mouse / touch — R to restart</div>
<noscript>This game needs JavaScript.</noscript>
<script src="game.js"></script>
<script>
(function () {
  'use strict';
  var cv = document.getElementById('game');
  var ctx = cv.getContext('2d');
  var hint = document.getElementById('hint');
  var CW = window.CW;
  var state = null;
  var keys = Object.create(null);
  var pointer = { x: 0, y: 0, active: false };
  var seed = (Date.now() >>> 0);

  function start() {
    state = CW.create(seed);
    pointer.active = false;
  }
  start();

  function hideHint() { hint.classList.add('gone'); }

  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowleft','arrowright','arrowup','arrowdown',' ','w','a','s','d'].indexOf(k) !== -1) e.preventDefault();
    if (k === 'r') { seed = (Date.now() >>> 0); start(); return; }
    keys[k] = true;
    pointer.active = false;
    hideHint();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });

  function toWorld(ev) {
    var r = cv.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) / r.width * CW.W,
      y: (ev.clientY - r.top) / r.height * CW.H
    };
  }
  cv.addEventListener('pointermove', function (ev) {
    var w = toWorld(ev); pointer.x = w.x; pointer.y = w.y; pointer.active = true;
    hideHint();
  });
  cv.addEventListener('pointerdown', function (ev) {
    var w = toWorld(ev); pointer.x = w.x; pointer.y = w.y; pointer.active = true;
    hideHint();
    if (state && state.over) { seed = (Date.now() >>> 0); start(); }
  });
  cv.addEventListener('pointerleave', function () { pointer.active = false; });

  function axis() {
    var ax = 0, ay = 0;
    if (keys['arrowleft'] || keys['a']) ax -= 1;
    if (keys['arrowright'] || keys['d']) ax += 1;
    if (keys['arrowup'] || keys['w']) ay -= 1;
    if (keys['arrowdown'] || keys['s']) ay += 1;
    if (ax === 0 && ay === 0 && pointer.active && state) {
      var dx = pointer.x - state.p.x, dy = pointer.y - state.p.y;
      var d = Math.hypot(dx, dy);
      if (d > 1) {
        // full speed until close, then ease off so the cursor settles on the point
        var m = Math.min(1, d / 60);
        ax = dx / d * m; ay = dy / d * m;
      }
    }
    return { ax: ax, ay: ay };
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    CW.step(dt, axis());
    CW.draw(ctx);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
